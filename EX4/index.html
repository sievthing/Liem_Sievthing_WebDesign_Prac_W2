<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookstore</title>
    <style>
        table, th, td{
            border: 1px solid rgb(0, 0, 0);
            border-collapse: collapse;
        }
        th, td{
            padding: 4px;
        }
        img{
            width: 100px;
            height: 100px;
        }
    </style>
</head>
<body>
    <h1>Welcome to Our Bookstore!</h1>
    <table>
        <tr>
            <th>Product Name</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>In Stock</th>
            <th>Product Image</th>
        </tr>
        <tr>
            <td>Howl's Moving Castle</td>
            <td>$15</td>
            <td>5</td>
            <td>YES</td>
            <td><img src="https://i.pinimg.com/1200x/10/1f/8a/101f8a08c8c36ce668a55ae6277321ae.jpg" alt="Howl"></td>
        </tr>
        <tr>
            <td>Jujutsu Kaisen</td>
            <td>$12</td>
            <td>40</td>
            <td>YES</td>
            <td><img src="https://i.pinimg.com/736x/0b/b1/57/0bb15758db041d4037ec2a6e08e092cd.jpg" alt="Jujutsu Kaisen"></td>
        </tr>
        <tr>
            <td>Spirited Away</td>
            <td>$20</td>
            <td>25</td>
            <td>NO</td>
            <td><img src="https://i.pinimg.com/736x/36/30/e4/3630e4df7755ffed832d942437fe3e77.jpg" alt="Spirited Away"></td>
        </tr>
    </table>
</body>
</html>
